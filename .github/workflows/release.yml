name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build DMG
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || true

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate app icons
        run: swift Scripts/generate-app-icon.swift

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build DMG
        run: bash Scripts/make-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadioNaoufal-dmg
          path: dist/*.dmg

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
