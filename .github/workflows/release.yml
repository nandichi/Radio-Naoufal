name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build DMG
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode on runner
        # Pin op Xcode_16.0 brak builds zodra Apple in nieuwere SDK's de
        # MTAudioProcessingTapCreate Swift-import-signatuur veranderde.
        # We selecteren nu altijd de hoogste Xcode-versie die de runner-image
        # aanbiedt; dat houdt de build forward-compatible met nieuwere SDK's
        # zonder dat we het workflow-bestand voor elke Xcode-release moeten
        # aanpassen.
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST_XCODE" ]; then
            echo "Fout: geen Xcode_*.app gevonden in /Applications"
            ls -la /Applications/ | grep -i xcode
            exit 1
          fi
          echo "Selecting $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate app icons
        run: swift Scripts/generate-app-icon.swift

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build DMG
        run: bash Scripts/make-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: RadioNaoufal-dmg
          path: dist/*.dmg

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
