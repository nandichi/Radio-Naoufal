        values="M 0 30 Q 75 46 150 30 T 300 30 T 450 30 T 600 30 T 750 30 T 900 30 T 1050 30 T 1200 30;
                M 0 30 Q 75 14 150 30 T 300 30 T 450 30 T 600 30 T 750 30 T 900 30 T 1050 30 T 1200 30;
                M 0 30 Q 75 46 150 30 T 300 30 T 450 30 T 600 30 T 750 30 T 900 30 T 1050 30 T 1200 30"
        dur="4.5s" repeatCount="indefinite"/>
    </path>
    <path d="M 0 30 Q 75 22 150 30 T 300 30 T 450 30 T 600 30 T 750 30 T 900 30 T 1050 30 T 1200 30" opacity="0.3">
