<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Radio Naoufal - 1980s boombox header">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0d10"/>
      <stop offset="55%" stop-color="#16181d"/>
      <stop offset="100%" stop-color="#0a0b0e"/>
    </linearGradient>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2218"/>
      <stop offset="50%" stop-color="#1e120a"/>
      <stop offset="100%" stop-color="#10080a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6f6f6"/>
      <stop offset="50%" stop-color="#9aa0a6"/>
      <stop offset="100%" stop-color="#3c4148"/>
    </linearGradient>
    <radialGradient id="speakerGrad" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#2c2f36"/>
      <stop offset="60%" stop-color="#0e0f12"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="coneGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#4a4f57"/>
      <stop offset="60%" stop-color="#1a1c20"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="tapeWindow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2530"/>
      <stop offset="100%" stop-color="#070b10"/>
    </linearGradient>
    <linearGradient id="reelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9dde2"/>
      <stop offset="100%" stop-color="#6a6f76"/>
    </linearGradient>
    <linearGradient id="vuFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4ead0"/>
      <stop offset="100%" stop-color="#c9b87a"/>
    </linearGradient>
    <linearGradient id="eqGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#11d27a"/>
      <stop offset="60%" stop-color="#f5d23a"/>
      <stop offset="100%" stop-color="#ff3b3b"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grille" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.1" fill="#000" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- ambient color wash -->
  <circle cx="220" cy="120" r="240" fill="#ff6a3d" opacity="0.08">
    <animate attributeName="opacity" values="0.06;0.14;0.06" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="320" r="260" fill="#3da9ff" opacity="0.08">
    <animate attributeName="opacity" values="0.06;0.14;0.06" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- boombox chassis -->
  <g transform="translate(140 60)">
    <rect x="0" y="0" width="920" height="300" rx="22" fill="url(#chassis)" stroke="#000" stroke-width="2"/>
    <rect x="6" y="6" width="908" height="288" rx="18" fill="none" stroke="#000" stroke-opacity="0.45" stroke-width="1.5"/>

    <!-- handle -->
    <path d="M 360 -22 Q 460 -56 560 -22" stroke="url(#chrome)" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="360" cy="-22" r="6" fill="url(#chrome)"/>
    <circle cx="560" cy="-22" r="6" fill="url(#chrome)"/>

    <!-- LEFT SPEAKER -->
    <g transform="translate(140 150)">
      <circle r="110" fill="url(#speakerGrad)" stroke="#000" stroke-width="3"/>
      <circle r="100" fill="url(#coneGrad)"/>
      <circle r="95" fill="url(#grille)"/>
      <circle r="38" fill="#1b1d22" stroke="#000" stroke-width="2"/>
      <circle r="14" fill="#2a2d33">
        <animate attributeName="r" values="13;17;13" dur="0.45s" repeatCount="indefinite"/>
      </circle>
      <circle r="6" fill="#ff7a45" filter="url(#strongGlow)">
        <animate attributeName="opacity" values="0.8;0.35;0.8" dur="0.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- RIGHT SPEAKER -->
    <g transform="translate(780 150)">
      <circle r="110" fill="url(#speakerGrad)" stroke="#000" stroke-width="3"/>
      <circle r="100" fill="url(#coneGrad)"/>
      <circle r="95" fill="url(#grille)"/>
      <circle r="38" fill="#1b1d22" stroke="#000" stroke-width="2"/>
      <circle r="14" fill="#2a2d33">
        <animate attributeName="r" values="13;18;13" dur="0.5s" repeatCount="indefinite" begin="0.15s"/>
      </circle>
      <circle r="6" fill="#3da9ff" filter="url(#strongGlow)">
        <animate attributeName="opacity" values="0.8;0.35;0.8" dur="0.55s" repeatCount="indefinite" begin="0.2s"/>
      </circle>
    </g>

    <!-- CENTER PANEL -->
    <g transform="translate(300 22)">
      <rect x="0" y="0" width="320" height="256" rx="10" fill="#0e0f12" stroke="#000" stroke-width="2"/>
      <rect x="6" y="6" width="308" height="244" rx="8" fill="none" stroke="#2c2f36" stroke-width="1"/>

      <!-- VU meters -->
      <g transform="translate(20 18)">
        <rect width="130" height="58" rx="6" fill="url(#vuFace)" stroke="#1a1206" stroke-width="2"/>
        <text x="65" y="14" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#3a2a08" text-anchor="middle" letter-spacing="1.2">VU - L</text>
        <path d="M 12 50 Q 65 8 118 50" stroke="#7a5a18" stroke-width="0.5" fill="none"/>
        <g transform="translate(65 50)">
          <line x1="0" y1="0" x2="0" y2="-38" stroke="#b00020" stroke-width="1.6" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate" values="-42;26;-12;38;-30;18" dur="2.2s" repeatCount="indefinite"/>
          </line>
          <circle r="3" fill="#1a1206"/>
        </g>
      </g>
      <g transform="translate(170 18)">
        <rect width="130" height="58" rx="6" fill="url(#vuFace)" stroke="#1a1206" stroke-width="2"/>
        <text x="65" y="14" font-family="Helvetica, Arial, sans-serif" font-size="7" fill="#3a2a08" text-anchor="middle" letter-spacing="1.2">VU - R</text>
        <path d="M 12 50 Q 65 8 118 50" stroke="#7a5a18" stroke-width="0.5" fill="none"/>
        <g transform="translate(65 50)">
          <line x1="0" y1="0" x2="0" y2="-38" stroke="#b00020" stroke-width="1.6" stroke-linecap="round">
            <animateTransform attributeName="transform" type="rotate" values="-30;30;-8;36;-24;14" dur="2.1s" repeatCount="indefinite" begin="0.2s"/>
          </line>
          <circle r="3" fill="#1a1206"/>
        </g>
      </g>

      <!-- Cassette deck window -->
      <g transform="translate(20 92)">
        <rect width="280" height="86" rx="6" fill="url(#tapeWindow)" stroke="#000" stroke-width="2"/>
        <rect x="3" y="3" width="274" height="80" rx="4" fill="none" stroke="#2a3d50" stroke-width="0.8"/>
        <!-- reels -->
        <g transform="translate(70 43)">
          <circle r="26" fill="#0c0f12" stroke="#444" stroke-width="1"/>
          <g>
            <circle r="20" fill="url(#reelGrad)"/>
            <g stroke="#2a2d33" stroke-width="2" stroke-linecap="round">
              <line x1="-18" y1="0" x2="-8" y2="0"/>
              <line x1="18" y1="0" x2="8" y2="0"/>
              <line x1="0" y1="-18" x2="0" y2="-8"/>
              <line x1="0" y1="18" x2="0" y2="8"/>
              <line x1="-13" y1="-13" x2="-6" y2="-6"/>
              <line x1="13" y1="13" x2="6" y2="6"/>
              <line x1="-13" y1="13" x2="-6" y2="6"/>
              <line x1="13" y1="-13" x2="6" y2="-6"/>
            </g>
            <circle r="4" fill="#1b1d22"/>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
          </g>
        </g>
        <g transform="translate(210 43)">
          <circle r="26" fill="#0c0f12" stroke="#444" stroke-width="1"/>
          <g>
            <circle r="20" fill="url(#reelGrad)"/>
            <g stroke="#2a2d33" stroke-width="2" stroke-linecap="round">
              <line x1="-18" y1="0" x2="-8" y2="0"/>
              <line x1="18" y1="0" x2="8" y2="0"/>
              <line x1="0" y1="-18" x2="0" y2="-8"/>
              <line x1="0" y1="18" x2="0" y2="8"/>
              <line x1="-13" y1="-13" x2="-6" y2="-6"/>
              <line x1="13" y1="13" x2="6" y2="6"/>
              <line x1="-13" y1="13" x2="-6" y2="6"/>
              <line x1="13" y1="-13" x2="6" y2="-6"/>
            </g>
            <circle r="4" fill="#1b1d22"/>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
          </g>
        </g>
        <!-- tape band -->
        <path d="M 90 43 Q 140 64 190 43" stroke="#5b4422" stroke-width="2.2" fill="none" opacity="0.75"/>
        <!-- station label -->
        <text x="140" y="78" font-family="Menlo, Courier, monospace" font-size="9" fill="#a8c0d8" text-anchor="middle" letter-spacing="2">NPO 3FM - 96.8 MHz</text>
      </g>

      <!-- EQ bars -->
      <g transform="translate(20 192)">
        <rect x="-4" y="-4" width="288" height="50" rx="4" fill="#05070a" stroke="#1c1f24"/>
        <g>
          <rect x="0" y="14" width="14" height="28" fill="url(#eqGrad)">
            <animate attributeName="height" values="6;36;14;30;8;28" dur="0.9s" repeatCount="indefinite"/>
            <animate attributeName="y" values="36;6;28;12;34;14" dur="0.9s" repeatCount="indefinite"/>
          </rect>
          <rect x="18" y="6" width="14" height="36" fill="url(#eqGrad)">
            <animate attributeName="height" values="14;30;8;38;18;26" dur="1.0s" repeatCount="indefinite"/>
            <animate attributeName="y" values="28;12;34;4;24;16" dur="1.0s" repeatCount="indefinite"/>
          </rect>
          <rect x="36" y="10" width="14" height="32" fill="url(#eqGrad)">
            <animate attributeName="height" values="20;36;10;28;16;34" dur="0.85s" repeatCount="indefinite"/>
            <animate attributeName="y" values="22;6;32;14;26;8" dur="0.85s" repeatCount="indefinite"/>
          </rect>
          <rect x="54" y="4" width="14" height="38" fill="url(#eqGrad)">
            <animate attributeName="height" values="28;14;38;20;30;10" dur="1.1s" repeatCount="indefinite"/>
            <animate attributeName="y" values="14;28;4;22;12;32" dur="1.1s" repeatCount="indefinite"/>
          </rect>
          <rect x="72" y="14" width="14" height="28" fill="url(#eqGrad)">
            <animate attributeName="height" values="8;30;14;34;6;28" dur="0.95s" repeatCount="indefinite"/>
            <animate attributeName="y" values="34;12;28;8;36;14" dur="0.95s" repeatCount="indefinite"/>
          </rect>
          <rect x="90" y="10" width="14" height="32" fill="url(#eqGrad)">
            <animate attributeName="height" values="22;10;34;14;30;18" dur="0.8s" repeatCount="indefinite"/>
            <animate attributeName="y" values="20;32;8;28;12;24" dur="0.8s" repeatCount="indefinite"/>
          </rect>
          <rect x="108" y="6" width="14" height="36" fill="url(#eqGrad)">
            <animate attributeName="height" values="32;16;38;20;28;12" dur="1.05s" repeatCount="indefinite"/>
            <animate attributeName="y" values="10;26;4;22;14;30" dur="1.05s" repeatCount="indefinite"/>
          </rect>
          <rect x="126" y="12" width="14" height="30" fill="url(#eqGrad)">
            <animate attributeName="height" values="14;34;10;30;18;26" dur="0.9s" repeatCount="indefinite"/>
            <animate attributeName="y" values="28;8;32;12;24;16" dur="0.9s" repeatCount="indefinite"/>
          </rect>
          <rect x="144" y="6" width="14" height="36" fill="url(#eqGrad)">
            <animate attributeName="height" values="30;14;38;18;28;10" dur="1.0s" repeatCount="indefinite"/>
            <animate attributeName="y" values="12;28;4;24;14;32" dur="1.0s" repeatCount="indefinite"/>
          </rect>
          <rect x="162" y="14" width="14" height="28" fill="url(#eqGrad)">
            <animate attributeName="height" values="10;28;14;32;6;26" dur="0.85s" repeatCount="indefinite"/>
            <animate attributeName="y" values="32;14;28;10;36;16" dur="0.85s" repeatCount="indefinite"/>
          </rect>
          <rect x="180" y="10" width="14" height="32" fill="url(#eqGrad)">
            <animate attributeName="height" values="20;36;10;28;16;34" dur="0.95s" repeatCount="indefinite"/>
            <animate attributeName="y" values="22;6;32;14;26;8" dur="0.95s" repeatCount="indefinite"/>
          </rect>
          <rect x="198" y="4" width="14" height="38" fill="url(#eqGrad)">
            <animate attributeName="height" values="28;14;38;20;30;10" dur="1.1s" repeatCount="indefinite"/>
            <animate attributeName="y" values="14;28;4;22;12;32" dur="1.1s" repeatCount="indefinite"/>
          </rect>
          <rect x="216" y="14" width="14" height="28" fill="url(#eqGrad)">
            <animate attributeName="height" values="8;30;14;34;6;28" dur="0.9s" repeatCount="indefinite"/>
            <animate attributeName="y" values="34;12;28;8;36;14" dur="0.9s" repeatCount="indefinite"/>
          </rect>
          <rect x="234" y="10" width="14" height="32" fill="url(#eqGrad)">
            <animate attributeName="height" values="22;10;34;14;30;18" dur="0.8s" repeatCount="indefinite"/>
            <animate attributeName="y" values="20;32;8;28;12;24" dur="0.8s" repeatCount="indefinite"/>
          </rect>
          <rect x="252" y="6" width="14" height="36" fill="url(#eqGrad)">
            <animate attributeName="height" values="32;16;38;20;28;12" dur="1.05s" repeatCount="indefinite"/>
            <animate attributeName="y" values="10;26;4;22;14;30" dur="1.05s" repeatCount="indefinite"/>
          </rect>
          <rect x="270" y="12" width="14" height="30" fill="url(#eqGrad)">
            <animate attributeName="height" values="14;34;10;30;18;26" dur="0.95s" repeatCount="indefinite"/>
            <animate attributeName="y" values="28;8;32;12;24;16" dur="0.95s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>
    </g>

    <!-- Chrome knobs -->
    <g transform="translate(36 30)">
      <circle r="14" fill="url(#chrome)" stroke="#000" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="0" y2="-9" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="-50;-20;20;50;10;-30;-50" dur="9s" repeatCount="indefinite"/>
      </line>
    </g>
    <g transform="translate(884 30)">
      <circle r="14" fill="url(#chrome)" stroke="#000" stroke-width="1.2"/>
      <line x1="0" y1="0" x2="0" y2="-9" stroke="#0a0a0a" stroke-width="2" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="40;10;-30;-50;-10;30;40" dur="9s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- Power LED -->
    <circle cx="460" cy="290" r="3.5" fill="#ff3b3b" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="478" y="293" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#7a7f87" letter-spacing="2">POWER</text>
  </g>

  <!-- Top-right brand mark -->
  <g transform="translate(1080 32)" opacity="0.65">
    <text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#9aa0a6" letter-spacing="4" text-anchor="end">v1.0 - macOS 15+</text>
  </g>

  <!-- Scanline overlay -->
  <g opacity="0.05">
    <rect width="1200" height="420" fill="url(#bgGrad)"/>
    <g>
      <rect x="0" y="0" width="1200" height="1" fill="#fff"/>
      <rect x="0" y="4" width="1200" height="1" fill="#fff"/>
      <rect x="0" y="8" width="1200" height="1" fill="#fff"/>
      <rect x="0" y="12" width="1200" height="1" fill="#fff"/>
    </g>
  </g>
</svg>
